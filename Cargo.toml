[package]
name = "learning-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "derive", "migrate", "macros"] }
tokio = { version = "1.53.2", features = ["full"] }
